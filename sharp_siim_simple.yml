# SHARP on SIIM - Simple Direct Load
# Just point to SHARP checkpoint and see if it works

includes:
  - configs/_base_/models/mgca_vit.yml  # Use ViT base (not ResNet)

name: SHARP
ckpt_dir: experiments/classification/siim/
use_amp: True
seed: 42

dataset:
  proto: SIIM_Pneumothorax_Dataset
  data_path: datasets/SIIM
  csvpath: datasets/SIIM/siim_labels.csv
  extension: ".png"
  split: "train_1"
  num_workers: 0  # Windows multiprocessing fix

transforms:
  type: NIHTransforms

model:
  proto: ImageClassifier

  cnn:
    pretrained: D:/experiments/exp3_full_sharp/p3_best.pt  # SHARP checkpoint
    prefix: image_encoder.vit.  # Strip SHARP's prefix to get raw ViT weights
    num_classes: 0  # Disable encoder's classifier
    global_pool: token  # Use CLS token
    permute: no_permute
    freeze: False

  classifier:
    proto: Classifier
    num_classes: 2
    use_fc_norm: True
    trunc_init: True
    dropout: 0.

  loss:
    proto: BCEWithLogitsLoss

trainer:
  optimizer: AdamW
  optim_params:
    lr: 1e-4
    eps: 1e-08
    optim_groups: ve_only
    lr_multiplier_ve: 0.1
  batch_size: 32
  clip_grad_norm: 1.0
  lr_decay: WarmupCosineScheduler
  lr_decay_params:
    warmup_steps: 50
    t_total: 3000
  epochs: 30
  early_stop: 10
  eval_start: 5
  eval_interval: 2
  early_stop_metric: binary_auroc

validator:
  batch_size: 128
  metrics: [binary_accuracy, binary_auroc]
  splits: [val]
