name: SHARP
ckpt_dir: D:/experiments/benchx_results/siim_sharp/
use_amp: True
seed: 42

dataset:
  proto: SIIM_Pneumothorax_Dataset
  data_path: datasets/SIIM
  csvpath: datasets/SIIM/siim_labels.csv
  split: "train_1"
  num_workers: 4

transforms:
  type: NIHTransforms

model:
  proto: ImageClassifier

  cnn:
    output_layer: avgpool
    pretrained: D:/experiments/exp3_full_sharp/p3_best.pt
    freeze: False

  classifier:
    proto: Classifier
    num_classes: 2
    use_fc_norm: True
    trunc_init: True
    dropout: 0.

  loss:
    proto: BCEWithLogitsLoss

trainer:
  optimizer: AdamW
  optim_params:
    lr: 1e-4
    eps: 1e-08
    optim_groups: ve_only
    lr_multiplier_ve: 0.1
    weight_decay: 0.01
  batch_size: 32
  clip_grad_norm: 1.0
  lr_decay: WarmupCosineScheduler
  lr_decay_params:
    warmup_steps: 50
    t_total: 3000
  epochs: 30
  early_stop: 10
  eval_start: 5
  eval_interval: 2
  early_stop_metric: binary_auroc

validator:
  batch_size: 128
  metrics: [binary_accuracy, binary_auroc]
  splits: [val]
